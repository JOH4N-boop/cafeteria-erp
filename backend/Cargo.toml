[package]
name = "cafeteria-backend"
version = "0.1.0"
edition = "2021"
description = "Backend Rust (Axum + SQLite) del ERP/POS de la cafetería"

[[bin]]
name = "cafeteria-backend"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
scrypt = { version = "0.11", default-features = false, features = ["std"] }
base64 = "0.22"
hex = "0.4"
rand = "0.8"
chrono = "0.4"

[profile.dev]
opt-level = 0
